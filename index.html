    // Mobile Navigation Drawer Toggle
    function toggleMobileMenu() {
      const drawer = document.getElementById('mobileMenuDrawer');
      if (drawer.classList.contains('hidden')) {
        drawer.classList.remove('hidden');
        document.body.classList.add('overflow-hidden');
      } else {
        drawer.classList.add('hidden');
        document.body.classList.remove('overflow-hidden');
      }
    }

    // Format Currency Helper
    function formatPrice(usd) {
      const curr = CURRENCY_RATES[currentCurrency] || CURRENCY_RATES.IQD;
      const amount = Math.round(usd * curr.rate);
      if (currentCurrency === 'USD') {
        return '$' + usd.toLocaleString() + ' USD';
      }
      return `${amount.toLocaleString()} ${curr.symbol}`;
    }

    // Notification System Handlers
    function playNotificationSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
      } catch (e) {}
    }

      });

      window.addEventListener('touchmove', (e) => {
        if (e.touches.length > 0) {
          mouse.targetX = e.touches[0].clientX;
          mouse.targetY = e.touches[0].clientY;
        }
      }, { passive: true });

      function rotateX(pt, angle) {
        const cos = Math.cos(angle);
        const sin = Math.sin(angle);
        return {
          x: pt.x,
          y: pt.y * cos - pt.z * sin,
          z: pt.y * sin + pt.z * cos
        };
      }

      function rotateY(pt, angle) {
        const cos = Math.cos(angle);
        const sin = Math.sin(angle);
        return {
          x: pt.x * cos + pt.z * sin,
          y: pt.y,
          z: -pt.x * sin + pt.z * cos
        };
      }

      function renderFrame() {
        ctx.clearRect(0, 0, width, height);

        // Smooth Mouse Parallax
        mouse.x += (mouse.targetX - mouse.x) * 0.05;
        mouse.y += (mouse.targetY - mouse.y) * 0.05;

        const offsetX = (mouse.x - width / 2) * 0.1;
        const offsetY = (mouse.y - height / 2) * 0.1;

        // Render 3D Constellation Nodes
        const projectedParticles = [];
        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];

          p.x += p.vx;
          p.y += p.vy;
          p.z += p.vz;

          if (p.x < -width) p.x = width;
          if (p.x > width) p.x = -width;
          if (p.y < -height) p.y = height;
          if (p.y > height) p.y = -height;
          if (p.z < -fov) p.z = fov;
          if (p.z > fov) p.z = -fov;

          const scale = fov / (fov + p.z);
          const px = (p.x + offsetX) * scale + width / 2;
          const py = (p.y + offsetY) * scale + height / 2;

          projectedParticles.push({ x: px, y: py, scale: scale, color: p.color, radius: p.radius });

          if (scale > 0) {
            ctx.beginPath();
            ctx.arc(px, py, p.radius * scale, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.shadowBlur = 10 * scale;
            ctx.shadowColor = p.color;
            ctx.globalAlpha = Math.min(1, Math.max(0.1, scale * 0.8));
            ctx.fill();
          }
        }

        // Connect nearby 3D nodes with glowing lines
        const maxDist = isMobile ? 80 : 120;
        for (let i = 0; i < projectedParticles.length; i++) {
          for (let j = i + 1; j < projectedParticles.length; j++) {
            const p1 = projectedParticles[i];
            const p2 = projectedParticles[j];
            const dx = p1.x - p2.x;
            const dy = p1.y - p2.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < maxDist) {
              const alpha = (1 - dist / maxDist) * 0.25 * Math.min(p1.scale, p2.scale);
              ctx.beginPath();
              ctx.moveTo(p1.x, p1.y);
              ctx.lineTo(p2.x, p2.y);
              ctx.strokeStyle = '#06b6d4';
              ctx.globalAlpha = alpha;
              ctx.lineWidth = 0.8;
              ctx.stroke();
            }
          }
        }

        // Render Rotating 3D Core Polyhedron
        const transformedVertices = vertices.map(v => {
          let r = rotateX(v, angleX);
          r = rotateY(r, angleY);
          const scale = fov / (fov + r.z + 400);
          return {
            x: (r.x + offsetX * 0.5) * scale + width / 2,
            y: (r.y + offsetY * 0.5) * scale + height / 2,
            scale: scale
          };
        });

        angleX += 0.002;
        angleY += 0.003;

        ctx.lineWidth = 1.2;
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#eab308';
        edges.forEach(([i, j]) => {
          const v1 = transformedVertices[i];
          const v2 = transformedVertices[j];
          ctx.beginPath();
          ctx.moveTo(v1.x, v1.y);
          ctx.lineTo(v2.x, v2.y);
          ctx.strokeStyle = '#eab308';
          ctx.globalAlpha = 0.35;
          ctx.stroke();
        });

        ctx.globalAlpha = 1.0;
        ctx.shadowBlur = 0;

        requestAnimationFrame(renderFrame);
      }

      renderFrame();
    })();

    // Initial Setup On Load
    populateCalcDropdowns();
    renderServices();
    recalculateCost();
  </script>
</body>
</html>
